{% extends "base.html" %}
{% block title %}Vidhive — добавить загрузку{% endblock %}
{% block content %}
<div class="card">
  <h2>Добавить загрузку</h2>
  <form method="post" action="/add">
    <label>Название (необязательно)</label>
    <input type="text" name="name" placeholder="например, kinescope 0..500000">

    <label>Режим</label>
    <select name="mode">
      <option value="range">Сканирование диапазона</option>
      <option value="single">Один ID / ссылка kinescope</option>
    </select>

    <label>Значение</label>
    <input type="text" name="value" placeholder="[0,500000]  ·  или  ·  200673499  ·  или  ·  http://kinescope.io/200673499">

    <label>Размер блока (для сканирования)</label>
    <input type="number" name="chunk_size" value="5000" min="1">

    <div style="margin-top:16px">
      <input type="submit" class="btn primary" value="Создать и запустить">
      <a class="btn" href="/jobs">Отмена</a>
    </div>
  </form>
  <p class="muted" style="margin-top:14px">
    Диапазон: <code>[A,B]</code> — от A до B, <code>A</code> — от 0 до A, <code>[A,]</code> — от A без конца, пусто — от 0 без конца.
    Режим «один ID» создаёт задание на одну конкретную запись.
  </p>
</div>
{% endblock %}
