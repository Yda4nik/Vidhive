{% extends "base.html" %}
{% block title %}Vidhive — настройка{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:60px auto">
  <h2>Первоначальная настройка</h2>
  <p class="muted tiny">Создайте первого администратора — с него начинается доступ к системе.</p>
  {% if error %}<p style="color:var(--bad)">⚠ {{ error }}</p>{% endif %}
  <form method="post" action="/setup">
    <label>Логин администратора</label>
    <input type="text" name="username" autofocus required>
    <label>Пароль</label>
    <input type="password" name="password" required>
    <label>Повторите пароль</label>
    <input type="password" name="confirm" required>
    <div style="margin-top:16px">
      <input type="submit" class="btn primary" value="Создать администратора">
    </div>
  </form>
</div>
{% endblock %}
