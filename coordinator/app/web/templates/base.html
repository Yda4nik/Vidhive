<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vidhive{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { --bg:#0f1420; --card:#1a2130; --line:#2a3550; --txt:#e8edf5; --muted:#94a3b8;
            --accent:#7c9cff; --ok:#3fb27f; --bad:#e05a5a; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.6 system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--txt); }
    header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; }
    header h1 { font-size:20px; margin:0; font-weight:600; }
    header nav { margin-left:auto; display:flex; gap:18px; }
    header nav a { color:var(--muted); text-decoration:none; }
    header nav a:hover { color:var(--txt); }
    main { padding:24px; max-width:1100px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:20px; }
    .card h2 { margin:0 0 12px; font-size:16px; font-weight:600; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:500; font-size:13px; }
    .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; }
    .pill.ok { background:rgba(63,178,127,.15); color:var(--ok); }
    .pill.bad { background:rgba(224,90,90,.15); color:var(--bad); }
    .pill.run { background:rgba(124,156,255,.18); color:var(--accent); }
    .muted { color:var(--muted); }
    .empty { color:var(--muted); font-style:italic; }
    a.btn, button.btn, input[type=submit] { display:inline-block; padding:6px 12px; border-radius:8px;
      border:1px solid var(--line); background:#232c40; color:var(--txt); font-size:13px; cursor:pointer;
      text-decoration:none; }
    a.btn:hover, button.btn:hover { border-color:var(--accent); }
    .btn.primary { background:var(--accent); color:#0f1420; border-color:var(--accent); }
    form.inline { display:inline; margin:0; }
    label { display:block; margin:12px 0 4px; color:var(--muted); font-size:13px; }
    input[type=text], input[type=number], select { width:100%; padding:8px 10px; border-radius:8px;
      border:1px solid var(--line); background:#121826; color:var(--txt); font-size:14px; }
    .row { display:flex; gap:12px; align-items:center; }
    .actions { display:flex; gap:6px; }
    .stats { display:flex; gap:28px; flex-wrap:wrap; }
    .stat { display:flex; flex-direction:column; }
    .stat .v { font-size:24px; font-weight:500; }
    .stat .k { font-size:12px; color:var(--muted); }
    .bar { height:6px; background:#0d1220; border-radius:3px; overflow:hidden; margin-bottom:4px; min-width:110px; }
    .bar span { display:block; height:100%; background:var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>🐝 Vidhive</h1>
    <nav>
      <a href="/">Панель</a>
      <a href="/servers">Серверы</a>
      <a href="/library">Библиотека</a>
      <a href="/jobs">Задания</a>
      <a href="/add">+ Загрузка</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
