name: vidhive

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidhive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidhive}
      POSTGRES_DB: ${POSTGRES_DB:-vidhive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidhive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [vidhive]

  # Coordinator serves both the REST API and the web dashboard (UI at /).
  coordinator:
    build:
      context: ..
      dockerfile: coordinator/Dockerfile
    environment:
      VIDHIVE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vidhive}:${POSTGRES_PASSWORD:-vidhive}@postgres:5432/${POSTGRES_DB:-vidhive}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vidhive]

  # Controllable stand-in for the target service, for safe end-to-end runs
  # (spec sections 20 and 23). Returns 200+video / 404 / 403 / 429 / 500 by id.
  mock:
    build:
      context: ..
      dockerfile: mock/Dockerfile
    environment:
      MOCK_PAYLOAD_KB: ${MOCK_PAYLOAD_KB:-256}
    ports:
      - "8090:8090"
    networks: [vidhive]

  agent-01:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    environment:
      VIDHIVE_COORDINATOR_URL: http://coordinator:8000
      # Point at the mock service for safe end-to-end runs; defaults to the real target.
      VIDHIVE_TARGET_TEMPLATE: ${TARGET_TEMPLATE:-http://kinescope.io/{id}}
      VIDHIVE_RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      VIDHIVE_WORKER_NAME: agent-01
      VIDHIVE_THREADS: "8"
      VIDHIVE_STORAGE_PATH: /data/videos
    volumes:
      - videos-01:/data/videos
    depends_on:
      coordinator:
        condition: service_healthy
    networks: [vidhive]

  agent-02:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    environment:
      VIDHIVE_COORDINATOR_URL: http://coordinator:8000
      # Point at the mock service for safe end-to-end runs; defaults to the real target.
      VIDHIVE_TARGET_TEMPLATE: ${TARGET_TEMPLATE:-http://kinescope.io/{id}}
      VIDHIVE_RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      VIDHIVE_WORKER_NAME: agent-02
      VIDHIVE_THREADS: "16"
      VIDHIVE_STORAGE_PATH: /data/videos
    volumes:
      - videos-02:/data/videos
    depends_on:
      coordinator:
        condition: service_healthy
    networks: [vidhive]

  agent-03:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    environment:
      VIDHIVE_COORDINATOR_URL: http://coordinator:8000
      # Point at the mock service for safe end-to-end runs; defaults to the real target.
      VIDHIVE_TARGET_TEMPLATE: ${TARGET_TEMPLATE:-http://kinescope.io/{id}}
      VIDHIVE_RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      VIDHIVE_WORKER_NAME: agent-03
      VIDHIVE_THREADS: "8"
      VIDHIVE_STORAGE_PATH: /data/videos
    volumes:
      - videos-03:/data/videos
    depends_on:
      coordinator:
        condition: service_healthy
    networks: [vidhive]

networks:
  vidhive:

volumes:
  pgdata:
  videos-01:
  videos-02:
  videos-03:
