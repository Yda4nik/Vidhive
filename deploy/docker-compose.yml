name: vidhive

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidhive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidhive}
      POSTGRES_DB: ${POSTGRES_DB:-vidhive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidhive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [vidhive]

  # Coordinator serves both the REST API and the web dashboard (UI at /).
  coordinator:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: coordinator/Dockerfile
    environment:
      VIDHIVE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vidhive}:${POSTGRES_PASSWORD:-vidhive}@postgres:5432/${POSTGRES_DB:-vidhive}
      # Access control (see deploy/.env.example). Empty admin/token = feature off.
      VIDHIVE_SECRET_KEY: ${VIDHIVE_SECRET_KEY:-}
      VIDHIVE_ADMIN_USER: ${VIDHIVE_ADMIN_USER:-}
      VIDHIVE_ADMIN_PASSWORD: ${VIDHIVE_ADMIN_PASSWORD:-}
      VIDHIVE_AGENT_TOKEN: ${VIDHIVE_AGENT_TOKEN:-}
      # true = admin pages/setup/docs are closed to requests that come through a tunnel.
      VIDHIVE_RESTRICT_PUBLIC: ${VIDHIVE_RESTRICT_PUBLIC:-true}
      # Address SSH-deployed agents use to reach the coordinator (e.g. the tunnel link).
      VIDHIVE_PUBLIC_URL: ${VIDHIVE_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vidhive]

  # Optional public link: a Cloudflare "Quick Tunnel" (free, no account). It makes an
  # outbound connection to Cloudflare and publishes the coordinator at a random
  # https://<words>.trycloudflare.com address; the address CHANGES whenever this
  # container is recreated. Requests that arrive through it are treated as public by
  # the app (no admin pages, no /docs, no first-run setup — see VIDHIVE_RESTRICT_PUBLIC).
  #   start :  docker compose --profile tunnel up -d tunnel
  #   address: docker compose logs tunnel | grep trycloudflare.com
  #   stop  :  docker compose --profile tunnel rm -sf tunnel
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    # http2 (TCP) instead of the default QUIC (UDP): QUIC kept dropping on the home
    # network ("no recent network activity") and Cloudflare answered 530.
    command: tunnel --no-autoupdate --protocol http2 --url http://coordinator:8000
    depends_on:
      coordinator:
        condition: service_healthy
    networks: [vidhive]

  # Optional VPN gateway for the agents (AmneziaWG). The agents send their internet traffic
  # through this container (set VIDHIVE_EGRESS_GATEWAY=vpn in .env); coordinator <-> agent
  # traffic stays on the Docker network. The tunnel config holds secrets and is NOT in git:
  # put it at deploy/vpn/awg0.conf (mode 600). Image: any with awg-quick + amneziawg-go.
  #   start :  docker compose --profile vpn up -d vpn
  #   check :  docker compose exec vpn awg show
  vpn:
    profiles: ["vpn"]
    image: ${VPN_IMAGE:-amneziawg-ready:latest}
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./vpn/awg0.conf:/etc/amnezia/amneziawg/awg0.conf
    networks: [vidhive]

  # Controllable stand-in for the target service, for safe end-to-end runs
  # (spec sections 20 and 23). Returns 200+video / 404 / 403 / 429 / 500 by id.
  mock:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: mock/Dockerfile
    environment:
      MOCK_PAYLOAD_KB: ${MOCK_PAYLOAD_KB:-256}
    ports:
      - "8090:8090"
    networks: [vidhive]

  agent-01:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: agent/Dockerfile
    environment:
      VIDHIVE_COORDINATOR_URL: http://coordinator:8000
      # Point at the mock service for safe end-to-end runs; defaults to the real target.
      VIDHIVE_TARGET_TEMPLATE: ${TARGET_TEMPLATE:-http://kinescope.io/{id}}
      VIDHIVE_RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      VIDHIVE_WORKER_NAME: agent-01
      # Internet traffic through a VPN gateway container (e.g. 172.16.1.250); empty = direct.
      VIDHIVE_EGRESS_GATEWAY: ${VIDHIVE_EGRESS_GATEWAY:-}
      # Threads: AGENT_THREADS sets all servers at once, AGENT_0N_THREADS
      # overrides one (individual wins over global — spec section 4).
      VIDHIVE_THREADS: ${AGENT_01_THREADS:-${AGENT_THREADS:-34}}
      VIDHIVE_STORAGE_PATH: /data/videos
      VIDHIVE_AGENT_TOKEN: ${VIDHIVE_AGENT_TOKEN:-}
    cap_add: [NET_ADMIN]   # only used to move the default route when an egress gateway is set
    volumes:
      - videos-01:/data/videos
    depends_on:
      coordinator:
        condition: service_healthy
    networks: [vidhive]

  agent-02:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: agent/Dockerfile
    environment:
      VIDHIVE_COORDINATOR_URL: http://coordinator:8000
      # Point at the mock service for safe end-to-end runs; defaults to the real target.
      VIDHIVE_TARGET_TEMPLATE: ${TARGET_TEMPLATE:-http://kinescope.io/{id}}
      VIDHIVE_RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      VIDHIVE_WORKER_NAME: agent-02
      # Internet traffic through a VPN gateway container (e.g. 172.16.1.250); empty = direct.
      VIDHIVE_EGRESS_GATEWAY: ${VIDHIVE_EGRESS_GATEWAY:-}
      VIDHIVE_THREADS: ${AGENT_02_THREADS:-${AGENT_THREADS:-33}}
      VIDHIVE_STORAGE_PATH: /data/videos
      VIDHIVE_AGENT_TOKEN: ${VIDHIVE_AGENT_TOKEN:-}
    cap_add: [NET_ADMIN]   # only used to move the default route when an egress gateway is set
    volumes:
      - videos-02:/data/videos
    depends_on:
      coordinator:
        condition: service_healthy
    networks: [vidhive]

  agent-03:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: agent/Dockerfile
    environment:
      VIDHIVE_COORDINATOR_URL: http://coordinator:8000
      # Point at the mock service for safe end-to-end runs; defaults to the real target.
      VIDHIVE_TARGET_TEMPLATE: ${TARGET_TEMPLATE:-http://kinescope.io/{id}}
      VIDHIVE_RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      VIDHIVE_WORKER_NAME: agent-03
      # Internet traffic through a VPN gateway container (e.g. 172.16.1.250); empty = direct.
      VIDHIVE_EGRESS_GATEWAY: ${VIDHIVE_EGRESS_GATEWAY:-}
      VIDHIVE_THREADS: ${AGENT_03_THREADS:-${AGENT_THREADS:-33}}
      VIDHIVE_STORAGE_PATH: /data/videos
      VIDHIVE_AGENT_TOKEN: ${VIDHIVE_AGENT_TOKEN:-}
    cap_add: [NET_ADMIN]   # only used to move the default route when an egress gateway is set
    volumes:
      - videos-03:/data/videos
    depends_on:
      coordinator:
        condition: service_healthy
    networks: [vidhive]

networks:
  vidhive:

volumes:
  pgdata:
  videos-01:
  videos-02:
  videos-03:
