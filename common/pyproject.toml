[project]
name = "vidhive-common"
version = "0.1.0"
description = "Shared API contracts and status enums for Vidhive"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vidhive_common*"]
